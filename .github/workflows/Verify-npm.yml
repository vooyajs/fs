name: Verify npm musl
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published @vooya/fs version
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  alpine:
    name: npm install on Alpine - node@${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - name: Install published package without build tools and exercise public APIs
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          docker run --rm --platform linux/amd64 \
            -e PACKAGE_VERSION \
            -v "$GITHUB_WORKSPACE/scripts/verify-npm.cjs:/consumer/verify-npm.cjs:ro" \
            -w /consumer "node:${{ matrix.node }}-alpine" sh -eu -c '
              for tool in rustc cargo cc gcc g++; do
                if command -v "$tool"; then
                  echo "Unexpected build tool: $tool"
                  exit 1
                fi
              done
              npm init -y
              # npm can accept publication before either package is queryable.
              # Wait for both manifests before npm creates an optional-dependency lockfile.
              for attempt in $(seq 1 40); do
                if npm view --prefer-online --registry=https://registry.npmjs.org "@vooya/fs@$PACKAGE_VERSION" version &&
                   npm view --prefer-online --registry=https://registry.npmjs.org "@vooya/fs-linux-x64-musl@$PACKAGE_VERSION" version; then
                  break
                fi
                if [ "$attempt" = 40 ]; then exit 1; fi
                sleep 15
              done
              npm install --ignore-scripts --include=optional --prefer-online --registry=https://registry.npmjs.org "@vooya/fs@$PACKAGE_VERSION"
              node verify-npm.cjs
            '
